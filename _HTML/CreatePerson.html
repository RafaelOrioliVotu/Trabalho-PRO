<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIE SEU PERSONAGEM</title>
    <link rel="stylesheet" href="../_CSS/CreatePerson.css">
</head>
<body>
    <div id="principal">
        <img src="../_IMAGES/logo (2).png" alt="LOGO">
        <form method="post" action="../_PHP/CreatePerson.php">
            <p>|Username|</p>
            <input type="text" name="username" placeholder="Insira o Username">
            <p>|Servidor|</p>
            <select name="servidor">
                <option value="">Asia</option>
                <option value="">Europa</option>
                <option value="">Oceania</option>
                <option value="">America</option>
            </select>
            <p>|Descrição|</p>
            <textarea name="descricao"></textarea>
            <p>|Sexo|</p>
            <select name="sexo">
                <option value="">Homem</option>
                <option value="">Mulher</option>
            </select>
            <p>|Spawn|</p>
            <select name="spawn">
                <option value="">Vila Ochi</option>
                <option value="">Vila Aikawa</option>
                <option value="">Cidadela Ares</option>
            </select><br>
            <input id="btt" type="submit" value="CRIAR">
        </form>
    </div>
</body>
</html>
